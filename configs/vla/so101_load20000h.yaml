model:
  model_path: robbyant/lingbot-vla-4b
  tokenizer_path: Qwen/Qwen2.5-VL-3B-Instruct

data:
  datasets_type: vla
  data_name: so101
  train_path: /home/zy/.cache/huggingface/lerobot/ZhangYong/lerobot_dataset_a_20260921_164625
  joints:
    - arm.position: 14
    - effector.position: 2
  cameras:
    - camera_side
    - camera_wrist
  num_workers: 8
  norm_type: meanstd
  norm_stats_file: assets/norm_stats/so101.json

train:
  output_dir: "output/so101"
  data_parallel_mode: fsdp2
  enable_full_shard: false
  module_fsdp_enable: true
  use_compile: true
  rmpad: false
  rmpad_with_pos_ids: false
  ulysses_parallel_size: 1
  freeze_vision_encoder: true # 冻结视觉编码器
  train_expert_only: true # 冻结 VLM（视觉和语言主干），只训练动作专家
  tokenizer_max_length: 72
  max_action_dim: 75
  max_state_dim: 75
  lr: 5.0e-5
  lr_decay_style: constant
  micro_batch_size: 32
  gradient_accumulation_steps: 1 # global_batch_size = micro_batch_size * gradient_accumulation_steps * 8 = 256 when we train with 8 GPUs
  max_steps: 40000
  ckpt_manager: dcp
  save_steps: 10000
  save_epochs: 0
  enable_fp32: true   # Control the precision of the action expert
  enable_resume: true
